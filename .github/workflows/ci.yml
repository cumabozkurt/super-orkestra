name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: CLI duman testi
        run: node packages/cli/dist/index.js --version
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts && npm run build
      - run: npm pack --dry-run -w super-orkestra-core -w super-orkestra
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: packages/vscode/*.vsix }
