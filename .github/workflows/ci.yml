name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke test
        run: node packages/cli/dist/index.js --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts && npm run build
      - run: npm pack --dry-run -w super-orkestra-core -w super-orkestra
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v6
        with: { name: vsix, path: packages/vscode/*.vsix }

  desktop:
    name: desktop (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "packages/desktop/src-tauri -> target" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      # tauri::generate_context! needs the built frontend (frontendDist = ../dist)
      - run: npm run build -w super-orkestra-desktop
      - run: cargo check --locked
        working-directory: packages/desktop/src-tauri
